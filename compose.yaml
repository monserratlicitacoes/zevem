name: zevem
services:
  frontend:
    build: .
    image: zevem-frontend:${ZEVEM_RELEASE:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3201:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    image: zevem-backend:${ZEVEM_RELEASE:-local}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3200
      DATA_DIR: /data
      TRUST_PROXY: 1
    ports:
      - "127.0.0.1:3202:3200"
    volumes:
      - zevem-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  zevem-data:
