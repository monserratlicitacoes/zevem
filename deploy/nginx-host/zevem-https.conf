server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.zevem.com.br;

    ssl_certificate /etc/letsencrypt/live/app.zevem.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.zevem.com.br/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3201;
    }

    # O fluxo OAuth atual transmite a sessão master na URL de autorização.
    location = /api/auth/google {
        access_log off;
        proxy_pass http://127.0.0.1:3202/auth/google;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook do WhatsApp (Meta). O integrador valida a assinatura de cada chamada.
    location = /whatsapp/webhook {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3203/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # As rotas /integracao são só para o integrador, que usa a rede interna do Docker.
    location /api/integracao/ {
        return 404;
    }

    location /api/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:3202/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
